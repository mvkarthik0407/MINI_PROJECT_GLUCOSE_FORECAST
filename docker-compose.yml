services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: diabetes
      POSTGRES_USER: diabetes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - diabetes-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U diabetes -d diabetes"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      MODEL_PATH: /app/models/best_gru_model.pth
      SCALER_PATH: /app/scalers/glucose_scaler.pkl
      MODEL_DEVICE: cpu
      APP_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env}
      CGM_WEBHOOK_SECRET: ${CGM_WEBHOOK_SECRET:?Set CGM_WEBHOOK_SECRET in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 10s
      timeout: 5s
      retries: 10
    depends_on:
      db:
        condition: service_healthy

volumes:
  diabetes-db:
